name: Deploy

# Тег v* (наприклад v1.0.0): збираємо образ, публікуємо в GHCR, розгортаємо на хостингу і
# перевіряємо, що в /health працює саме ця збірка.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dogfight

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Ім'я образу (ghcr вимагає нижній регістр)
        id: meta
        run: |
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Збірка і публікація (два етапи, SHA і тег усередині образу)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v4 # потрібен verify-image.sh (ws-probe.ts)
        with:
          node-version-file: .nvmrc

      - name: Перевірка опублікованого образу (розмір, не root, health, docker stop)
        run: bash scripts/verify-image.sh "${{ steps.meta.outputs.image }}:${{ github.ref_name }}" "${{ github.sha }}"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      # Хостинг тягне образ із GHCR. Для Render це "Deploy Hook" сервісу з Docker-образом;
      # URL лежить у секреті DEPLOY_HOOK_URL, а публічна адреса гри в змінній APP_URL.
      - name: Розгортання
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ needs.image.outputs.image }}:${{ github.ref_name }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::Секрет DEPLOY_HOOK_URL не заданий: образ опубліковано, але не розгорнуто"
            exit 0
          fi
          ENCODED=$(printf '%s' "$IMAGE_REF" | jq -sRr @uri)
          curl -fsS -X POST "${DEPLOY_HOOK_URL}&imgURL=${ENCODED}"
          echo

      # Після деплою в /health має з'явитись sha цього коміту і цей тег
      - name: Чекаємо нову збірку на живій адресі
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::Змінна APP_URL не задана: пропускаю перевірку живої адреси"
            exit 0
          fi
          for i in $(seq 1 60); do
            BODY=$(curl -fsS "$APP_URL/health" || true)
            echo "[$i] $BODY"
            if echo "$BODY" | grep -q "\"sha\":\"${{ github.sha }}\"" && echo "$BODY" | grep -q "\"version\":\"${{ github.ref_name }}\""; then
              echo "Живий /health віддає sha ${{ github.sha }} і версію ${{ github.ref_name }}"
              curl -fsS "$APP_URL/ready"
              exit 0
            fi
            sleep 10
          done
          echo "::error::За 10 хвилин на $APP_URL так і не з'явилась збірка ${{ github.sha }}"
          exit 1
